          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - available
            - in_progress
            - completed
            - skipped
        activeSeconds:
          type: integer
          minimum: 0
        recommendSkip:
          type: boolean
        derivationFormat:
          type: string
          nullable: true
          enum:
            - classic
            - teaching_v1
          description: Null on older rows. classic is the original formal-derivation path; teaching_v1 is the program-analyzed teaching derivation.
