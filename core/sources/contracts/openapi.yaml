openapi: 3.1.0
info:
  title: XueLearn Core Learning API
  version: 0.1.0
  description: Public learning and owner-scoped source contracts. Hosts own authentication and transport.
servers:
  - url: http://127.0.0.1:3001
    description: Local API gateway
paths:
  /api/learning-trajectory/mainline/activities/{id}/position:
    get:
      operationId: resolveLearningMainlinePosition
      summary: Resolve an owned historical position or fall back to its goal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainlineResolvedPosition"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/mainline:
    get:
      operationId: getLearningMainline
      summary: Current window focus and recent learning segments (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainlineSnapshot"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/mainline/next:
    get:
      operationId: getLearningMainlineNext
      summary: Deterministic course and review selection independent of agenda and models
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
        - name: goalId
          in: query
          required: false
          schema:
            type: string
        - name: boundary
          in: query
          required: false
          schema:
            type: boolean
        - name: timeLimitMinutes
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainlineDecision"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/mainline/commands:
    post:
      operationId: commandLearningMainline
      summary: Idempotent revision-checked learning action; never writes mastery evidence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainlineCommand"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainlineSnapshot"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory:
    get:
      operationId: getLearningTrajectory
      summary: get Learning Trajectory (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: query
          schema: &a1
            type: string
        - name: cursor
          in: query
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTrajectorySnapshot"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/preferences:
    get:
      operationId: getLearningGuidancePreferences
      summary: get Learning Guidance Preferences (desktop local)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGuidancePreferences"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: saveLearningGuidancePreferences
      summary: save Learning Guidance Preferences (desktop local)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                autoSaveSupplements: &a2
                  type: boolean
                proactiveGuidance: *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGuidancePreferences"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/branches/{id}:
    get:
      operationId: getLearningBranch
      summary: get Learning Branch (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - &a3
          name: id
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - branch
                  - material
                properties:
                  branch:
                    $ref: "#/components/schemas/LearningBranch"
                  material:
                    type:
                      - object
                      - "null"
                    additionalProperties: true
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/branches/{id}/actions:
    post:
      operationId: changeLearningBranch
      summary: change Learning Branch (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revision
                - action
              properties:
                revision: &a4
                  type: integer
                action:
                  type: string
                  enum:
                    - cancel
                    - dismiss
                    - defer
                    - resume
                    - retry
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningBranch"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/branches/{id}/enter:
    post:
      operationId: enterLearningBranch
      summary: enter Learning Branch (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - visitId
                - sessionId
                - returnPosition
              properties:
                visitId:
                  type: string
                  format: uuid
                sessionId: *a1
                returnPosition:
                  $ref: "#/components/schemas/LearningPosition"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningVisit"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/branches/{id}/confirm-goal:
    post:
      operationId: confirmLearningGoalProposal
      summary: confirm Learning Goal Proposal (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - spaceId
              properties:
                spaceId: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - plannedGoalId
                  - spaceId
                properties:
                  plannedGoalId: *a1
                  spaceId: *a1
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/visits/{id}:
    get:
      operationId: getLearningVisit
      summary: get Learning Visit (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - *a3
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningVisit"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/visits/{id}/actions:
    post:
      operationId: changeLearningVisit
      summary: change Learning Visit (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revision
                - action
              properties:
                revision: *a4
                action:
                  type: string
                  enum:
                    - position
                    - pause
                    - return
                position:
                  $ref: "#/components/schemas/LearningPosition"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningVisit"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/visits/{id}/feedback:
    post:
      operationId: reportLearningVisitFeedback
      summary: report Learning Visit Feedback (desktop local)
      security:
        - bearerAuth: []
      parameters:
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - eventId
              properties:
                kind:
                  type: string
                  enum:
                    - understood
                    - content_finished
                eventId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message: *a1
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/learning-trajectory/resolve-position:
    post:
      operationId: resolveLearningPosition
      summary: resolve Learning Position (desktop local)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningPosition"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - position
                  - exact
                properties:
                  position:
                    $ref: "#/components/schemas/LearningPosition"
                  exact: *a2
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/learning-spaces:
    get:
      operationId: getLearningSpacePortfolio
      summary: List Learning Spaces, roadmap items, relations, and unorganized goals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Learning Space portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpacePortfolio"
    post:
      operationId: createLearningSpace
      summary: Create a Learning Space
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningSpaceWriteRequest"
      responses:
        "201":
          description: Created Learning Space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpace"
  /api/learning-spaces/order:
    put:
      operationId: reorderLearningSpaces
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderedSpaceIds
              properties:
                orderedSpaceIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Reordered
  /api/learning-spaces/{spaceId}:
    get:
      operationId: getLearningSpaceDetail
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Learning Space detail with ordered roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpace"
        "404":
          $ref: "#/components/responses/ApiError"
    patch:
      operationId: updateLearningSpace
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningSpaceWriteRequest"
      responses:
        "200":
          description: Updated Learning Space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpace"
    delete:
      operationId: deleteLearningSpace
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted; real goals are now unorganized
  /api/learning-spaces/{spaceId}/planned-goals:
    post:
      operationId: createLearningSpacePlannedGoal
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                rationale:
                  type: string
                suggestedGoalKind:
                  type: string
                  enum:
                    - full
                    - micro
                goalBrief:
                  $ref: "#/components/schemas/PlannedGoalBriefV1"
      responses:
        "201":
          description: Planned goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpaceItem"
  /api/learning-spaces/{spaceId}/items/order:
    put:
      operationId: reorderLearningSpaceItems
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderedItemIds
              properties:
                orderedItemIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Reordered
  /api/learning-spaces/{spaceId}/relations:
    post:
      operationId: createLearningSpaceRelation
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fromItemId
                - toItemId
                - relationType
              properties:
                fromItemId:
                  type: string
                toItemId:
                  type: string
                relationType:
                  type: string
                  enum:
                    - prerequisite
                    - supports
                    - follow_up
                    - related
      responses:
        "201":
          description: Created relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpaceRelation"
  /api/learning-spaces/items/{itemId}:
    patch:
      operationId: updateLearningSpacePlannedGoal
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                rationale:
                  type: string
                suggestedGoalKind:
                  type: string
                  enum:
                    - full
                    - micro
                goalBrief:
                  oneOf:
                    - $ref: "#/components/schemas/PlannedGoalBriefV1"
                    - type: "null"
      responses:
        "200":
          description: Updated planned goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSpaceItem"
    delete:
      operationId: removeLearningSpaceItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed; referenced goal is preserved
  /api/learning-spaces/relations/{relationId}:
    delete:
      operationId: deleteLearningSpaceRelation
      security:
        - bearerAuth: []
      parameters:
        - name: relationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
  /api/learning-spaces/goals/{goalId}:
    put:
      operationId: moveGoalToLearningSpace
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - spaceId
              properties:
                spaceId:
                  type:
                    - string
                    - "null"
                includeFoundationGoalIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Moved
  /api/goals:
    get:
      operationId: listGoals
      summary: List learning goals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Goal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningGoal"
    post:
      operationId: createGoal
      summary: Create goal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
  /api/goals/mini:
    get:
      operationId: listMyMiniCourses
      summary: List only the authenticated learner's micro courses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Micro courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningGoal"
  /api/goals/{goalId}:
    get:
      operationId: getGoal
      summary: Get a learning goal and its units
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
        - name: view
          in: query
          description: compact (default) omits per-unit learningMaterial/sq/graph blobs; journey adds authoritative sequential modules; full includes legacy fat payloads
          schema:
            type: string
            enum:
              - compact
              - journey
              - full
            default: compact
      responses:
        "200":
          description: Goal detail
        "404":
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: deleteGoal
      summary: Delete goal
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /api/goals/{goalId}/plan:
    get:
      operationId: getGoalPlan
      summary: Get the persisted learner goal plan and planning status
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Goal plan projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: approveGoalPlan
      summary: Approve the persisted goal plan
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Goal plan approval result
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        "409":
          $ref: "#/components/responses/ApiError"
  /api/goals/{goalId}/settings:
    patch:
      operationId: patchGoalSettings
      summary: Update learner-editable goal settings
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                contentLanguage:
                  type: string
                coursePattern:
                  type: string
      responses:
        "200":
          description: Updated goal settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/goals/{goalId}/overview/units/{unitId}:
    patch:
      operationId: patchGoalOverviewUnitProgress
      summary: Complete or reopen an owned overview unit
      security:
        - bearerAuth: []
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                completed:
                  type: boolean
      responses:
        "200":
          description: Updated overview unit
          content:
            application/json:
              schema:
                type: object
                required:
                  - unit
                properties:
                  unit:
                    type: object
                    additionalProperties: true
        "404":
          $ref: "#/components/responses/ApiError"
  /api/rag/ingest:
    post:
      operationId: ingestGoalDocuments
      summary: Ingest learner-owned goal documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - goalId
              properties:
                goalId:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Ingested document summaries
          content:
            application/json:
              schema:
                type: object
                required:
                  - goalId
                  - fileCount
                  - chunks
                  - files
                properties:
                  goalId:
                    type: string
                  fileCount:
                    type: integer
                    minimum: 0
                  chunks:
                    type: integer
                    minimum: 0
                  files:
                    type: array
                    items:
                      type: object
                      required:
                        - filename
                        - chunks
                      properties:
                        filename:
                          type: string
                        chunks:
                          type: integer
                          minimum: 0
        "400":
          $ref: "#/components/responses/ApiError"
  /api/rag/ingest/stream:
    post:
      operationId: ingestGoalDocumentsWithProgress
      summary: Ingest learner-owned goal documents with NDJSON progress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - goalId
              properties:
                goalId:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: NDJSON progress events followed by a result or error event
          content:
            application/x-ndjson:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ApiError"
  /api/rag/documents/{documentId}:
    delete:
      operationId: deleteGoalDocument
      summary: Delete an owned goal document and its retrieval revisions
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: goalId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Document deletion result
          content:
            application/json:
