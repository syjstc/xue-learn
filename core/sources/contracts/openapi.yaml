          type: integer
          minimum: 0
        blockOffset:
          type: integer
          minimum: 0
        contentKind:
          type: string
          enum:
            - standard
            - formal_derivation
          description: formal_derivation is a stepwise symbolic-process section (proof, formula derivation, or STEM worked calculation), not ordinary prose material.
        material:
          oneOf:
            - $ref: "#/components/schemas/LearningMaterial"
            - type: "null"
