      responses:
        "200":
          description: Session and draft deleted
  /api/agent/goal-creation-sessions/{sessionId}/retry:
    post:
      operationId: retryGoalCreationSession
      summary: Retry a recoverable failed session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      responses:
        "201":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalCreationSessionResponse"
  /api/agent/goal-creation-sessions/{sessionId}/stop:
    post:
      operationId: stopGoalCreationSession
      summary: Permanently stop a goal-creation session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      responses:
        "201":
          description: Stopped session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalCreationSessionResponse"
  /api/agent/goal-creation-sessions/{sessionId}/message:
    post:
      operationId: sendGoalCreationSessionMessage
      summary: Submit a learner message to the dedicated creation workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                pageContext:
                  type: object
                  additionalProperties: true
                clientAction:
                  type: string
                seedTopic:
                  type: string
                documentSeed:
                  type: object
                  additionalProperties: true
                isSmallCourse:
                  type: boolean
                goalDraft:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Agent SSE response; work continues if the client detaches
  /api/agent/goal-creation-sessions/{sessionId}/resume-interaction:
    post:
      operationId: resumeGoalCreationSessionInteraction
      summary: Submit a tool, form, confirmation, or plan-review answer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toolCallId
                - result
              properties:
                toolCallId:
                  type: string
                result: {}
      responses:
        "200":
          description: Agent SSE response; work continues if the client detaches
  /api/agent/goal-creation-sessions/{sessionId}/documents:
    post:
      operationId: uploadGoalCreationSessionDocuments
      summary: Extract and durably stage files for this creation session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Extracted files staged
  /api/agent/goal-creation-sessions/{sessionId}/documents/analyze:
    post:
      operationId: analyzeGoalCreationSessionDocuments
      summary: Analyze the session's staged files and URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      responses:
        "201":
          description: Document-derived goal seed
  /api/agent/goal-creation-sessions/{sessionId}/urls:
    post:
      operationId: uploadGoalCreationSessionUrls
      summary: Extract and durably stage URLs for this creation session
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urls
              properties:
                urls:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        "201":
          description: URL extraction results
  /api/agent/goal-creation-sessions/{sessionId}/events:
    get:
      operationId: listGoalCreationSessionEvents
      summary: Read durable progress after an event cursor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Ordered durable event page
  /api/agent/goal-creation-sessions/{sessionId}/events/stream:
    get:
      operationId: streamGoalCreationSessionEvents
      summary: Reconnectable SSE stream of durable creation progress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GoalCreationSessionId"
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: text/event-stream
  /api/generation-runs/{runId}/cancel:
    post:
      operationId: cancelGenerationRun
      summary: Cancel an owned generation run
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Run cancelled or already terminal
        "404":
          $ref: "#/components/responses/ApiError"
  /api/course-sources/units/{unitId}:
    get:
      operationId: readCourseSourceSnapshot
      summary: Read an owned, complete published course source snapshot
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete versioned source
          content:
            application/json:
              schema:
                $ref: ./schemas/course-source-v1.json
        "404":
          $ref: "#/components/responses/ApiError"
  /api/course-sources/units/{unitId}/assets/{resourceId}:
    get:
      operationId: readCourseSourceAsset
      summary: Read hash-verified original source bytes
      security:
        - bearerAuth: []
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
        - name: sha256
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      responses:
        "200":
          description: Immutable source asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ApiError"
components:
  schemas:
    MainlineResolvedPosition:
      type: object
      required:
        - activityId
        - goalId
        - position
        - exact
        - fallback
      properties:
        activityId:
          type: string
        goalId:
          type:
            - string
            - "null"
        position:
          anyOf:
            - $ref: "#/components/schemas/LearningPosition"
            - type: "null"
        exact:
          type: boolean
        fallback:
          type: string
          enum:
            - position
            - goal
            - goals
      additionalProperties: false
    MainlineSnapshot:
      type: object
      required:
        - focus
        - activities
        - preferences
      properties:
        focus:
          $ref: "#/components/schemas/MainlineFocus"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/MainlineActivity"
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/MainlinePreference"
      additionalProperties: false
    MainlineDecision:
      type: object
      required:
        - policyVersion
        - snapshotVersion
        - expiresAt
        - primary
        - optional
        - reason
      properties:
        policyVersion:
          type: string
        snapshotVersion:
          type: string
        expiresAt:
          type: string
        primary:
          anyOf:
            - $ref: "#/components/schemas/MainlineCandidate"
            - type: "null"
        optional:
          anyOf:
            - $ref: "#/components/schemas/MainlineCandidate"
            - type: "null"
        reason:
          type: string
          enum:
            - current
            - next
            - return
            - preparing
            - review
            - other_goal
            - none
      additionalProperties: false
    MainlineCommand:
      type: object
      required:
        - commandId
        - sessionId
        - expectedRevision
        - action
      properties:
        commandId:
          type: string
          format: uuid
        sessionId:
          type: string
          minLength: 1
          maxLength: 160
        expectedRevision:
          type: integer
          minimum: 0
        action:
          type: string
          enum:
            - start
            - resume
            - position
            - pause
            - return
            - preference
            - shown
            - later
            - today
        activityId:
          type: string
        activityRevision:
          type: integer
        goalId:
          type: string
        unitId:
          type: string
        kind:
          type: string
          enum:
            - lesson
            - supplement
            - review
        branchId:
          type: string
        position:
          $ref: "#/components/schemas/LearningPosition"
        preference:
          type: object
          required:
            - newLearning
            - reviews
            - priority
            - revision
          properties:
            newLearning:
              type: string
              enum:
                - active
                - paused
            reviews:
              type: boolean
            priority:
              type: integer
              minimum: 0
              maximum: 10
            revision:
              type: integer
          additionalProperties: false
        candidateId:
          type: string
        snapshotVersion:
          type: string
        timezone:
          type: string
        timeLimitMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        reviewSource:
          type: string
          enum:
            - course
            - flashcards
      additionalProperties: false
    LearningTrajectorySnapshot:
      type: object
      required:
        - branches
        - visits
        - events
        - nextCursor
      properties:
        branches:
          type: array
          items:
            $ref: "#/components/schemas/LearningBranch"
        visits:
          type: array
          items:
            $ref: "#/components/schemas/LearningVisit"
        events:
          type: array
          items:
            $ref: "#/components/schemas/LearningTrajectoryEvent"
        nextCursor:
          type:
            - string
            - "null"
    LearningGuidancePreferences:
      type: object
      required:
        - autoSaveSupplements
        - proactiveGuidance
      properties:
        autoSaveSupplements: &a5
          type: boolean
        proactiveGuidance: *a5
    LearningBranch:
      type: object
      required:
        - id
        - unitId
        - goalId
        - sectionId
        - sourceThreadId
        - sourceEventId
        - origin
        - purpose
        - kind
        - title
        - reason
        - returnGoal
        - topics
        - status
        - deferred
        - revision
        - plannedGoalId
        - error
        - createdAt
        - updatedAt
      properties:
        id: &a6
          type: string
        unitId: *a6
        goalId: *a6
        sectionId:
          type:
            - string
            - "null"
        sourceThreadId:
          type:
            - string
            - "null"
        sourceEventId: *a6
        origin:
          $ref: "#/components/schemas/LearningPosition"
        purpose:
          type: string
          enum:
            - foundation
            - clarification
            - interest
        kind:
          type: string
          enum:
            - topic
            - section
            - goal
        title: *a6
        reason: *a6
        returnGoal: *a6
        topics:
          type: array
          items: *a6
        status:
          type: string
          enum:
            - preparing
            - ready
            - failed
            - cancelled
            - dismissed
            - proposed
        deferred: *a5
        revision: &a7
          type: integer
        plannedGoalId:
          type:
            - string
            - "null"
        error: *a6
        createdAt: *a6
        updatedAt: *a6
    LearningPosition:
      type: object
      required:
        - version
        - unitId
        - mode
      properties:
        version:
          type: integer
          const: 1
        unitId: *a6
        sectionId: *a6
        topicId: *a6
        topicTitle: *a6
        blockIdentity: *a6
        blockIndex: *a7
        contentRevision: *a7
        anchorText: *a6
        scrollOffset:
          type: number
        mode:
          type: string
          enum:
            - reading
            - classroom
        classroom:
          type: object
          required:
            - projectId
            - sourceHash
            - sceneId
            - tick
          properties:
            projectId: *a6
            sourceHash: *a6
            sceneId: *a6
            beatId: *a6
            tick: *a7
    LearningVisit:
      type: object
      required:
        - id
        - unitId
        - branchId
        - sessionId
        - state
        - returnPosition
        - position
        - revision
        - createdAt
        - updatedAt
      properties:
        id: *a6
        unitId: *a6
        branchId: *a6
        sessionId: *a6
        state:
          type: string
          enum:
            - active
            - paused
            - returned
        returnPosition:
          $ref: "#/components/schemas/LearningPosition"
        position:
          anyOf:
            - $ref: "#/components/schemas/LearningPosition"
            - type: "null"
        revision: *a7
        createdAt: *a6
        updatedAt: *a6
    LearningSpacePortfolio:
      type: object
      required:
        - fingerprint
        - spaces
        - unorganizedGoals
      properties:
        fingerprint:
          type: string
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/LearningSpace"
        unorganizedGoals:
          type: array
          items:
            $ref: "#/components/schemas/LearningSpaceGoal"
    LearningSpaceWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        purpose:
          type: string
          maxLength: 500
    LearningSpace:
      type: object
      required:
        - id
        - name
        - purpose
        - sortIndex
        - revision
        - createdAt
        - updatedAt
        - items
        - relations
      properties:
        id:
          type: string
        name:
          type: string
        purpose:
          type: string
        sortIndex:
          type: integer
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
