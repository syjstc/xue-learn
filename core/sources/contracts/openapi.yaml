          description: Published formal-derivation document when contentKind is formal_derivation and derivationFormat is classic or unset
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        derivationFormat:
          type: string
          nullable: true
          enum:
            - classic
            - teaching_v1
        teachingDerivation:
          description: Independent teaching-derivation document. Never written into derivation.
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        teachingDerivationDerived:
          description: Versioned program-generated trees, matches, and animation plans for teachingDerivation
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
