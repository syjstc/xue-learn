                $ref: "#/components/schemas/GoalCreationSessionResponse"
  /api/agent/goal-creation-sessions/active:
    get:
      operationId: getActiveGoalCreationSession
      summary: Get the learner's unfinished goal-creation session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active session or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalCreationSessionResponse"
  /api/agent/goal-creation-sessions/by-goal/{goalId}:
    get:
      operationId: getGoalCreationSessionByGoal
      summary: Get the creation session associated with a goal
      security:
        - bearerAuth: []
